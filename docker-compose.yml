
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: react_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      # Эта переменная очень важна для Windows, 
      # чтобы Hot Reload (автообновление страницы при сохранении кода) работал без сбоев
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true